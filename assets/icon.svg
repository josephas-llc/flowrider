<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="50%" style="stop-color:#c864ff"/>
      <stop offset="100%" style="stop-color:#00ffff"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bg)" stroke="url(#glow)" stroke-width="4"/>

  <!-- Icosahedron shape (20-faced polyhedron projected to 2D) -->
  <g transform="translate(512, 512)" filter="url(#neon)">
    <!-- Outer pentagon -->
    <polygon points="0,-280 266,-86 164,226 -164,226 -266,-86"
             fill="none" stroke="#00ffff" stroke-width="3"/>

    <!-- Inner pentagon (rotated) -->
    <polygon points="0,280 -266,86 -164,-226 164,-226 266,86"
             fill="none" stroke="#c864ff" stroke-width="3"/>

    <!-- Connecting lines -->
    <line x1="0" y1="-280" x2="164" y2="-226" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="-280" x2="-164" y2="-226" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
    <line x1="266" y1="-86" x2="266" y2="86" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
    <line x1="266" y1="-86" x2="164" y2="-226" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
    <line x1="164" y1="226" x2="266" y2="86" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
    <line x1="164" y1="226" x2="0" y2="280" stroke="#c864ff" stroke-width="2" opacity="0.7"/>
    <line x1="-164" y1="226" x2="0" y2="280" stroke="#c864ff" stroke-width="2" opacity="0.7"/>
    <line x1="-164" y1="226" x2="-266" y2="86" stroke="#c864ff" stroke-width="2" opacity="0.7"/>
    <line x1="-266" y1="-86" x2="-266" y2="86" stroke="#c864ff" stroke-width="2" opacity="0.7"/>
    <line x1="-266" y1="-86" x2="-164" y2="-226" stroke="#c864ff" stroke-width="2" opacity="0.7"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="20" fill="#00ffff" opacity="0.8"/>
  </g>
</svg>
